<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal dashboard to compare MCA colleges (NIMCET NITs, VIT backup), cities and places to stay."
    />
    <title>MCA Campus &amp; Stay Finder</title>
    <script>
      // Apply the saved or system theme before first paint (no light flash in dark mode).
      try {
        var t = localStorage.getItem('mca-theme')
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
