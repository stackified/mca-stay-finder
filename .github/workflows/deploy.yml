# Checks and deploys the static build to GitHub Pages (SPEC §14 Phase 8).
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
# Free on a public repository. No secrets are used.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by refresh-data.yml after it commits new data (a push made with GITHUB_TOKEN does
  # not start other workflows by itself).
  workflow_call:
    inputs:
      ref:
        description: Commit to build (default = the commit that started the run)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
